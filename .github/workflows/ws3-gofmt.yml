name: WS3 branch formatter

on:
  push:
    branches:
      - parallel/ws3-subscription-client

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws3-subscription-client
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format WS3 Go scope
        run: gofmt -w internal/httpapi
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- internal/httpapi; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/httpapi
          git commit -m 'style(ws3): gofmt HTTP delivery changes'
          git push origin HEAD:parallel/ws3-subscription-client
