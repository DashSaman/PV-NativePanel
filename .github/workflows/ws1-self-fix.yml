name: WS1 Deterministic Self Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: ws1-self-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'parallel/ws1-runtime-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws1-runtime-accounting
          fetch-depth: 1
      - name: Apply deterministic WS1 fixes
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          repo = Path.cwd()

          # PostgreSQL: RETURNS TABLE creates an output variable named service_term_id.
          # Target the primary-key constraint explicitly to avoid PL/pgSQL ambiguity.
          migration = repo / 'db/migrations/0009_direct_naive_exact_accounting.up.sql'
          sql = migration.read_text()
          old_a = 'ON CONFLICT (service_term_id) DO NOTHING;'
          old_b = 'ON CONFLICT(service_term_id) DO NOTHING;'
          if sql.count(old_a) != 2 or sql.count(old_b) != 1:
              raise SystemExit('unexpected ON CONFLICT accounting migration shape')
          sql = sql.replace(old_a, 'ON CONFLICT ON CONSTRAINT direct_naive_accounting_terms_pkey DO NOTHING;')
          sql = sql.replace(old_b, 'ON CONFLICT ON CONSTRAINT direct_naive_accounting_terms_pkey DO NOTHING;')
          migration.write_text(sql)

          # Keep the forwardproxy overlay outside the root Go package graph.
          old_overlay = repo / 'third_party/forwardproxy/overlay/pvnaive_accounting.go'
          new_overlay = repo / 'third_party/forwardproxy/overlay/pvnaive_accounting.go.src'
          if old_overlay.exists():
              old_overlay.rename(new_overlay)
          if not new_overlay.exists():
              raise SystemExit('missing forwardproxy overlay source')

          build = repo / 'scripts/build/build-pinned-accounting-caddy.sh'
          text = build.read_text()
          text = text.replace('${overlay_dir}/pvnaive_accounting.go', '${overlay_dir}/pvnaive_accounting.go.src')
          text = text.replace('cp "${overlay_dir}/"*.go "${src}/"', 'cp "${overlay_dir}/pvnaive_accounting.go.src" "${src}/pvnaive_accounting.go"')
          build.write_text(text)

          pin = (repo / 'third_party/forwardproxy/UPSTREAM_COMMIT').read_text().strip()
          with tempfile.TemporaryDirectory() as td:
              src = Path(td) / 'forwardproxy'
              subprocess.run(['git','clone','--quiet','https://github.com/klzgrad/forwardproxy.git',str(src)], check=True)
              subprocess.run(['git','-C',str(src),'checkout','--quiet',pin], check=True)

              fp = src / 'forwardproxy.go'
              s = fp.read_text()
              def rep(old, new, name):
                  global s
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected one match, got {count}')
                  s = s.replace(old, new, 1)

              rep('\t// TODO: temporary/deprecated - we should try to reuse existing authentication modules instead!\n\tAuthCredentials [][]byte `json:"auth_credentials,omitempty"` // slice with base64-encoded credentials\n}',
                  '\t// TODO: temporary/deprecated - we should try to reuse existing authentication modules instead!\n\tAuthCredentials [][]byte `json:"auth_credentials,omitempty"` // slice with base64-encoded credentials\n\n\t// PVNaive exact-accounting configuration. These are intentionally fixed,\n\t// narrow values; Caddy never receives a management-agent endpoint.\n\tPVNaiveAccountingSocket   string            `json:"pvnaive_accounting_socket,omitempty"`\n\tPVNaiveNodeID             string            `json:"pvnaive_node_id,omitempty"`\n\tPVNaiveRuntimeCredentials map[string]string `json:"pvnaive_runtime_credentials,omitempty"`\n\tpvnaiveAccountingClient   *pvnaiveAccountingClient\n}', 'handler-fields')
              rep('\t}\n\n\treturn nil\n}\n\nfunc (h *Handler) ServeHTTP',
                  '\t}\n\n\tif err := h.provisionPVNaiveAccounting(); err != nil {\n\t\treturn err\n\t}\n\n\treturn nil\n}\n\nfunc (h *Handler) ServeHTTP', 'provision')
              rep('\t\t}\n\n\t\t// HTTP CONNECT Fast Open: Directly responds with a 200 OK',
                  '\t\t}\n\n\t\taccountingSession, accountingErr := h.newPVNaiveAccountingSession(r)\n\t\tif accountingErr != nil {\n\t\t\tstatus := http.StatusServiceUnavailable\n\t\t\tif errors.Is(accountingErr, errPVNaiveQuotaDepleted) {\n\t\t\t\tstatus = http.StatusForbidden\n\t\t\t}\n\t\t\treturn caddyhttp.Error(status, accountingErr)\n\t\t}\n\n\t\t// HTTP CONNECT Fast Open: Directly responds with a 200 OK', 'session-create')
              old = '''\t\tdefer targetConn.Close()\n\n\t\tswitch r.ProtoMajor {\n\t\tcase 1: // http1: hijack the whole flow\n\t\t\treturn serveHijack(w, targetConn)\n\t\tcase 2: // http2: keep reading from "request" and writing into same response\n\t\t\tfallthrough\n\t\tcase 3:\n\t\t\tdefer r.Body.Close()\n\t\t\treturn dualStream(targetConn, r.Body, w, r.Header.Get("Padding") != "")\n\t\t}\n\n\t\tpanic("There was a check for http version, yet it's incorrect")\n'''
              new = '''\t\tdefer targetConn.Close()\n\n\t\tif accountingSession != nil {\n\t\t\tif err := accountingSession.open(r.Context()); err != nil {\n\t\t\t\treturn caddyhttp.Error(http.StatusServiceUnavailable, err)\n\t\t\t}\n\t\t\ttargetConn = &pvnaiveAccountingConn{Conn: targetConn, session: accountingSession}\n\t\t}\n\n\t\tvar streamErr error\n\t\tswitch r.ProtoMajor {\n\t\tcase 1: // http1: hijack the whole flow\n\t\t\tstreamErr = serveHijack(w, targetConn, accountingSession)\n\t\tcase 2: // http2: keep reading from "request" and writing into same response\n\t\t\tfallthrough\n\t\tcase 3:\n\t\t\tdefer r.Body.Close()\n\t\t\tstreamErr = dualStream(targetConn, r.Body, w, r.Header.Get("Padding") != "", accountingSession)\n\t\tdefault:\n\t\t\tpanic("There was a check for http version, yet it's incorrect")\n\t\t}\n\n\t\tvar closeErr error\n\t\tif accountingSession != nil {\n\t\t\tcloseErr = accountingSession.close(context.Background())\n\t\t}\n\t\tif streamErr != nil {\n\t\t\treturn streamErr\n\t\t}\n\t\treturn closeErr\n'''
              rep(old, new, 'connect-stream')
              rep('func serveHijack(w http.ResponseWriter, targetConn net.Conn) error {', 'func serveHijack(w http.ResponseWriter, targetConn net.Conn, accountingSession *pvnaiveAccountingSession) error {', 'serve-hijack-signature')
              rep('\tif n := brw.Reader.Buffered(); n > 0 {\n\t\trbuf, _ := brw.Peek(n)\n\t\t_, _ = targetConn.Write(rbuf)\n\t}', '\tif n := brw.Reader.Buffered(); n > 0 {\n\t\trbuf, _ := brw.Peek(n)\n\t\tnw, writeErr := targetConn.Write(rbuf)\n\t\tif writeErr != nil {\n\t\t\treturn writeErr\n\t\t}\n\t\tif nw != len(rbuf) {\n\t\t\treturn io.ErrShortWrite\n\t\t}\n\t}', 'http1-prebuffer')
              rep('\treturn dualStream(targetConn, clientConn, clientConn, false)\n}', '\treturn dualStream(targetConn, clientConn, clientConn, false, accountingSession)\n}', 'hijack-dual')
              rep('func dualStream(target net.Conn, clientReader io.ReadCloser, clientWriter io.Writer, padding bool) error {', 'func dualStream(target net.Conn, clientReader io.ReadCloser, clientWriter io.Writer, padding bool, accountingSession *pvnaiveAccountingSession) error {', 'dual-stream-signature')
              rep('\t\t_, _err := flushingIoCopy(w, r, buf, paddingType)', '\t\tvar downloadAccounting *pvnaiveAccountingSession\n\t\tif w == clientWriter {\n\t\t\tdownloadAccounting = accountingSession\n\t\t}\n\t\t_, _err := flushingIoCopy(w, r, buf, paddingType, downloadAccounting)', 'dual-copy')
              rep('func flushingIoCopy(dst io.Writer, src io.Reader, buf []byte, paddingType int) (written int64, err error) {', 'func flushingIoCopy(dst io.Writer, src io.Reader, buf []byte, paddingType int, accountingSession *pvnaiveAccountingSession) (written int64, err error) {', 'copy-signature')
              rep('\t\tvar nr int\n\t\tvar er error\n\t\tif paddingType == AddPadding', '\t\tvar nr int\n\t\tvar er error\n\t\taddedPadding := false\n\t\tif paddingType == AddPadding', 'padding-flag')
              rep('\t\t\tnumPadding++\n\t\t\tpaddingSize := rand.Intn(256)', '\t\t\tnumPadding++\n\t\t\taddedPadding = true\n\t\t\tpaddingSize := rand.Intn(256)', 'padding-set')
              rep('\t\tif nr > 0 {\n\t\t\tnw, ew := dst.Write(buf[0:nr])', '\t\tif nr > 0 {\n\t\t\tvar nw int\n\t\t\tvar ew error\n\t\t\tif accountingSession != nil {\n\t\t\t\tpayloadOffset := 0\n\t\t\t\tpayloadLength := nr\n\t\t\t\tif addedPadding {\n\t\t\t\t\tpayloadOffset = 3\n\t\t\t\t\tpayloadLength = int(buf[0])*256 + int(buf[1])\n\t\t\t\t}\n\t\t\t\tnw, ew = accountingSession.writeDownload(dst, buf[0:nr], payloadOffset, payloadLength)\n\t\t\t} else {\n\t\t\t\tnw, ew = dst.Write(buf[0:nr])\n\t\t\t}', 'accounted-write')
              fp.write_text(s)

              caddyfile = src / 'caddyfile.go'
              s = caddyfile.read_text()
              old = '''\t\t\th.AuthCredentials = append(h.AuthCredentials, EncodeAuthCredentials(args[0], args[1]))\n\n\t\tcase "hosts":'''
              new = '''\t\t\th.AuthCredentials = append(h.AuthCredentials, EncodeAuthCredentials(args[0], args[1]))\n\n\t\tcase "pvnaive_accounting_socket":\n\t\t\targs := d.RemainingArgs()\n\t\t\tif len(args) != 1 || h.PVNaiveAccountingSocket != "" {\n\t\t\t\treturn d.ArgErr()\n\t\t\t}\n\t\t\th.PVNaiveAccountingSocket = args[0]\n\n\t\tcase "pvnaive_node_id":\n\t\t\targs := d.RemainingArgs()\n\t\t\tif len(args) != 1 || h.PVNaiveNodeID != "" {\n\t\t\t\treturn d.ArgErr()\n\t\t\t}\n\t\t\th.PVNaiveNodeID = args[0]\n\n\t\tcase "pvnaive_runtime_credential":\n\t\t\targs := d.RemainingArgs()\n\t\t\tif len(args) != 2 {\n\t\t\t\treturn d.ArgErr()\n\t\t\t}\n\t\t\tif len(args[0]) == 0 || strings.Contains(args[0], ":") {\n\t\t\t\treturn d.Err("invalid pvnaive runtime-credential username")\n\t\t\t}\n\t\t\tif h.PVNaiveRuntimeCredentials == nil {\n\t\t\t\th.PVNaiveRuntimeCredentials = make(map[string]string)\n\t\t\t}\n\t\t\tif _, exists := h.PVNaiveRuntimeCredentials[args[0]]; exists {\n\t\t\t\treturn d.Errf("pvnaive runtime credential specified twice for user %s", args[0])\n\t\t\t}\n\t\t\th.PVNaiveRuntimeCredentials[args[0]] = args[1]\n\n\t\tcase "hosts":'''
              if s.count(old) != 1:
                  raise SystemExit('unexpected caddyfile shape')
              caddyfile.write_text(s.replace(old, new, 1))

              subprocess.run(['git','-C',str(src),'diff','--check'], check=True)
              patch = subprocess.check_output(['git','-C',str(src),'diff','--','forwardproxy.go','caddyfile.go'], text=True)
              (repo / 'third_party/forwardproxy/patches/0001-pvnaive-exact-accounting.patch').write_text(patch)
              subprocess.run(['git','-C',str(src),'reset','--hard','--quiet',pin], check=True)
              subprocess.run(['git','-C',str(src),'apply','--check',str(repo / 'third_party/forwardproxy/patches/0001-pvnaive-exact-accounting.patch')], check=True)
          PY

          up_sha="$(sha256sum db/migrations/0009_direct_naive_exact_accounting.up.sql | awk '{print $1}')"
          sed -i -E "s#^[0-9a-f]{64}  0009_direct_naive_exact_accounting.up.sql#${up_sha}  0009_direct_naive_exact_accounting.up.sql#" db/migrations/SHA256SUMS

          git apply --check third_party/forwardproxy/patches/0001-pvnaive-exact-accounting.patch < /dev/null || {
            tmp="$(mktemp -d)"
            git clone --quiet https://github.com/klzgrad/forwardproxy.git "${tmp}/fp"
            git -C "${tmp}/fp" checkout --quiet "$(cat third_party/forwardproxy/UPSTREAM_COMMIT)"
            git -C "${tmp}/fp" apply --check "${PWD}/third_party/forwardproxy/patches/0001-pvnaive-exact-accounting.patch"
            rm -rf "${tmp}"
          }

          git rm -- .github/workflows/ws1-self-fix.yml
          git config user.name 'PVNaive WS1 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add db/migrations/0009_direct_naive_exact_accounting.up.sql db/migrations/SHA256SUMS \
            scripts/build/build-pinned-accounting-caddy.sh third_party/forwardproxy/patches/0001-pvnaive-exact-accounting.patch \
            third_party/forwardproxy/overlay/pvnaive_accounting.go.src
          git add -u third_party/forwardproxy/overlay/pvnaive_accounting.go
          git diff --cached --check
          git commit -m 'fix(ws1): resolve accounting SQL and pinned patch integration'
          git push origin HEAD:parallel/ws1-runtime-accounting
