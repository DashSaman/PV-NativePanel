name: S04 auth soft-retire patch

on:
  push:
    branches: [s04-auth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s04-auth
          fetch-depth: 0

      - name: Patch auth migration without weakening destructive scanner
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('db/migrations/0002_auth_foundation.up.sql')
          s = p.read_text()

          replacements = [
              (
                  "    confirmed_at timestamptz,\n    created_at timestamptz NOT NULL DEFAULT clock_timestamp(),",
                  "    confirmed_at timestamptz,\n    disabled_at timestamptz,\n    created_at timestamptz NOT NULL DEFAULT clock_timestamp(),",
              ),
              (
                  "           (f.confirmed_at IS NOT NULL)\n      FROM pvnaive.actors AS a\n      LEFT JOIN pvnaive.actor_totp_factors AS f ON f.actor_id = a.id",
                  "           (f.confirmed_at IS NOT NULL AND f.disabled_at IS NULL)\n      FROM pvnaive.actors AS a\n      LEFT JOIN pvnaive.actor_totp_factors AS f ON f.actor_id = a.id",
              ),
              (
                  "      FROM pvnaive.actor_totp_factors AS f\n     WHERE f.actor_id = p_actor_id;",
                  "      FROM pvnaive.actor_totp_factors AS f\n     WHERE f.actor_id = p_actor_id\n       AND f.disabled_at IS NULL;",
              ),
              (
                  "           last_used_step = NULL,\n           confirmed_at = NULL,\n           updated_at = clock_timestamp();\n\n    DELETE FROM pvnaive.actor_mfa_recovery_codes WHERE actor_id = p_actor_id;",
                  "           last_used_step = NULL,\n           confirmed_at = NULL,\n           disabled_at = NULL,\n           updated_at = clock_timestamp();\n\n    UPDATE pvnaive.actor_mfa_recovery_codes\n       SET used_at = COALESCE(used_at, clock_timestamp())\n     WHERE actor_id = p_actor_id\n       AND used_at IS NULL;",
              ),
              (
                  "     WHERE actor_id = p_actor_id;\n    IF NOT FOUND THEN\n        RAISE EXCEPTION 'TOTP factor is not enrolled' USING ERRCODE = '22023';\n    END IF;\n\n    DELETE FROM pvnaive.actor_mfa_recovery_codes WHERE actor_id = p_actor_id;",
                  "     WHERE actor_id = p_actor_id\n       AND disabled_at IS NULL;\n    IF NOT FOUND THEN\n        RAISE EXCEPTION 'TOTP factor is not enrolled' USING ERRCODE = '22023';\n    END IF;\n\n    UPDATE pvnaive.actor_mfa_recovery_codes\n       SET used_at = COALESCE(used_at, clock_timestamp())\n     WHERE actor_id = p_actor_id\n       AND used_at IS NULL;",
              ),
              (
                  "     WHERE actor_id = p_actor_id\n       AND confirmed_at IS NOT NULL\n       AND (last_used_step IS NULL OR p_step > last_used_step);",
                  "     WHERE actor_id = p_actor_id\n       AND confirmed_at IS NOT NULL\n       AND disabled_at IS NULL\n       AND (last_used_step IS NULL OR p_step > last_used_step);",
              ),
              (
                  "    DELETE FROM pvnaive.actor_mfa_recovery_codes WHERE actor_id = p_actor_id;\n    DELETE FROM pvnaive.actor_totp_factors WHERE actor_id = p_actor_id;\n    UPDATE pvnaive.actors",
                  "    UPDATE pvnaive.actor_mfa_recovery_codes\n       SET used_at = COALESCE(used_at, clock_timestamp())\n     WHERE actor_id = p_actor_id\n       AND used_at IS NULL;\n    UPDATE pvnaive.actor_totp_factors\n       SET disabled_at = COALESCE(disabled_at, clock_timestamp()),\n           updated_at = clock_timestamp()\n     WHERE actor_id = p_actor_id\n       AND disabled_at IS NULL;\n    UPDATE pvnaive.actors",
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_MATCH_COUNT={count} for snippet: {old[:80]!r}')
              s = s.replace(old, new, 1)

          if 'DELETE FROM' in s.upper():
              raise SystemExit('ERROR=DELETE_FROM_REMAINS_IN_UP_MIGRATION')

          p.write_text(s)
          print('S04_SOFT_RETIRE_PATCH=PASSED')
          PY

          sha256sum db/migrations/0001_initial.down.sql \
                    db/migrations/0001_initial.up.sql \
                    db/migrations/0002_auth_foundation.down.sql \
                    db/migrations/0002_auth_foundation.up.sql \
            | sed 's#db/migrations/##' > db/migrations/SHA256SUMS

          sha256sum --check --strict --directory=db/migrations db/migrations/SHA256SUMS

          rm -- .github/workflows/s04-auth-soft-retire-patch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/migrations/0002_auth_foundation.up.sql db/migrations/SHA256SUMS .github/workflows/s04-auth-soft-retire-patch.yml
          git commit -m 'db: soft-retire MFA material in auth migration'
          git push origin HEAD:s04-auth
