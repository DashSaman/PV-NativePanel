name: S04 runtime fix once

on:
  push:
    branches: [s04-auth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s04-auth
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact runtime fixes and self-remove
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/auth/store.go",
              '''func (s *Store) RevokeSessionByID(ctx context.Context, tx *sql.Tx, actorID, sessionID string) (bool, error) {
          \tif tx == nil || actorID == "" || sessionID == "" {
          \t\treturn false, errors.New("auth: bound transaction, actor ID and session ID are required")
          \t}
          \tresult, err := tx.ExecContext(ctx, `UPDATE pvnaive.auth_sessions SET revoked_at=COALESCE(revoked_at,clock_timestamp()) WHERE id=$1::uuid AND actor_id=$2::uuid AND revoked_at IS NULL`, sessionID, actorID)
          \tif err != nil {
          \t\treturn false, fmt.Errorf("auth: revoke session by ID: %w", err)
          \t}
          \tcount, err := result.RowsAffected()
          \treturn count == 1, err
          }
          ''',
              '''func (s *Store) RevokeSessionByID(ctx context.Context, tx *sql.Tx, actorID, sessionID string) (bool, error) {
          \tif tx == nil || actorID == "" || sessionID == "" {
          \t\treturn false, errors.New("auth: bound transaction, actor ID and session ID are required")
          \t}
          \tvar revoked bool
          \tif err := tx.QueryRowContext(ctx, `SELECT pvnaive.auth_revoke_session_by_id($1::uuid,$2::uuid)`, actorID, sessionID).Scan(&revoked); err != nil {
          \t\treturn false, fmt.Errorf("auth: revoke session by ID: %w", err)
          \t}
          \treturn revoked, nil
          }
          ''')

          revoke_actor = '''CREATE FUNCTION pvnaive.auth_revoke_actor_sessions(p_actor_id uuid)
          RETURNS integer
          LANGUAGE plpgsql
          VOLATILE
          SECURITY DEFINER
          SET search_path = pg_catalog, pvnaive
          AS $$
          DECLARE
              changed integer;
          BEGIN
              UPDATE pvnaive.auth_sessions
                 SET revoked_at = COALESCE(revoked_at, clock_timestamp())
               WHERE actor_id = p_actor_id
                 AND revoked_at IS NULL;
              GET DIAGNOSTICS changed = ROW_COUNT;
              RETURN changed;
          END;
          $$;
          '''
          revoke_helpers = revoke_actor + '''
          CREATE FUNCTION pvnaive.auth_revoke_session_by_id(p_actor_id uuid, p_session_id uuid)
          RETURNS boolean
          LANGUAGE plpgsql
          VOLATILE
          SECURITY DEFINER
          SET search_path = pg_catalog, pvnaive
          AS $$
          DECLARE
              changed integer;
          BEGIN
              IF NOT pvnaive.has_valid_context()
                 OR pvnaive.current_actor_id() IS DISTINCT FROM p_actor_id THEN
                  RAISE EXCEPTION 'authentication context required' USING ERRCODE = '42501';
              END IF;
              UPDATE pvnaive.auth_sessions
                 SET revoked_at = COALESCE(revoked_at, clock_timestamp())
               WHERE id = p_session_id
                 AND actor_id = p_actor_id
                 AND revoked_at IS NULL;
              GET DIAGNOSTICS changed = ROW_COUNT;
              RETURN changed = 1;
          END;
          $$;

          CREATE FUNCTION pvnaive.auth_revoke_other_actor_sessions(p_actor_id uuid, p_current_session_id uuid)
          RETURNS bigint
          LANGUAGE plpgsql
          VOLATILE
          SECURITY DEFINER
          SET search_path = pg_catalog, pvnaive
          AS $$
          DECLARE
              changed bigint;
          BEGIN
              IF NOT pvnaive.has_valid_context()
                 OR pvnaive.current_actor_id() IS DISTINCT FROM p_actor_id THEN
                  RAISE EXCEPTION 'authentication context required' USING ERRCODE = '42501';
              END IF;
              UPDATE pvnaive.auth_sessions
                 SET revoked_at = COALESCE(revoked_at, clock_timestamp())
               WHERE actor_id = p_actor_id
                 AND id <> p_current_session_id
                 AND revoked_at IS NULL;
              GET DIAGNOSTICS changed = ROW_COUNT;
              RETURN changed;
          END;
          $$;
          '''
          replace_once("db/migrations/0002_auth_foundation.up.sql", revoke_actor, revoke_helpers)

          replace_once(
              "db/migrations/0002_auth_foundation.up.sql",
              '''CREATE FUNCTION pvnaive.auth_append_audit(
          ''',
              '''CREATE POLICY auth_audit_owner_insert ON pvnaive.audit_events
          FOR INSERT
          TO pvnaive_owner
          WITH CHECK (true);

          CREATE FUNCTION pvnaive.auth_append_audit(
          ''')

          replace_once(
              "db/migrations/0002_auth_foundation.up.sql",
              '''REVOKE ALL ON FUNCTION pvnaive.auth_revoke_actor_sessions(uuid) FROM PUBLIC;
          ''',
              '''REVOKE ALL ON FUNCTION pvnaive.auth_revoke_actor_sessions(uuid) FROM PUBLIC;
          REVOKE ALL ON FUNCTION pvnaive.auth_revoke_session_by_id(uuid, uuid) FROM PUBLIC;
          REVOKE ALL ON FUNCTION pvnaive.auth_revoke_other_actor_sessions(uuid, uuid) FROM PUBLIC;
          ''')
          replace_once(
              "db/migrations/0002_auth_foundation.up.sql",
              '''GRANT EXECUTE ON FUNCTION pvnaive.auth_revoke_actor_sessions(uuid) TO pvnaive_app;
          ''',
              '''GRANT EXECUTE ON FUNCTION pvnaive.auth_revoke_actor_sessions(uuid) TO pvnaive_app;
          GRANT EXECUTE ON FUNCTION pvnaive.auth_revoke_session_by_id(uuid, uuid) TO pvnaive_app;
          GRANT EXECUTE ON FUNCTION pvnaive.auth_revoke_other_actor_sessions(uuid, uuid) TO pvnaive_app;
          ''')

          replace_once(
              "db/migrations/0002_auth_foundation.down.sql",
              '''DROP FUNCTION pvnaive.auth_revoke_actor_sessions(uuid);
          DROP FUNCTION pvnaive.auth_revoke_session(bytea);
          ''',
              '''DROP FUNCTION pvnaive.auth_revoke_other_actor_sessions(uuid, uuid);
          DROP FUNCTION pvnaive.auth_revoke_session_by_id(uuid, uuid);
          DROP FUNCTION pvnaive.auth_revoke_actor_sessions(uuid);
          DROP FUNCTION pvnaive.auth_revoke_session(bytea);
          ''')
          replace_once(
              "db/migrations/0002_auth_foundation.down.sql",
              '''DROP FUNCTION pvnaive.auth_append_audit(uuid, text, text, text, uuid, inet);
          ''',
              '''DROP FUNCTION pvnaive.auth_append_audit(uuid, text, text, text, uuid, inet);
          DROP POLICY auth_audit_owner_insert ON pvnaive.audit_events;
          ''')

          rehearsal = Path("tests/stages/S04_auth_rehearsal.sh")
          text = rehearsal.read_text()
          if text.count("  set +e\n") != 1:
              raise SystemExit("rehearsal: unexpected set +e count")
          text = text.replace("  set +e\n", "", 1)
          old_rm = '    rm -rf -- "${tmpdir}"\n'
          if text.count(old_rm) != 1:
              raise SystemExit("rehearsal: temp cleanup match mismatch")
          text = text.replace(old_rm, '    rm -rf -- "${tmpdir}" || true\n', 1)
          audit_anchor = '''grep -q '\"role\":\"owner\"' "${tmpdir}/me.json"

          csrf="$(awk '$6 == "__Host-pvnaive_csrf" {print $7}' "${tmpdir}/cookies.txt" | tail -n1)"
          '''
          audit_insert = '''grep -q '\"role\":\"owner\"' "${tmpdir}/me.json"

          audit_count="$(psql_admin --dbname "${test_db}" --tuples-only --no-align --set=owner_email="${owner_email}" --command "SELECT COUNT(*) FROM pvnaive.audit_events WHERE actor_id=(SELECT id FROM pvnaive.actors WHERE lower(email)=lower(:'owner_email')) AND action='auth.login' AND outcome='success'")"
          [[ "${audit_count}" == "1" ]] || { echo "ERROR: login success audit count=${audit_count}" >&2; exit 1; }

          csrf="$(awk '$6 == "__Host-pvnaive_csrf" {print $7}' "${tmpdir}/cookies.txt" | tail -n1)"
          '''
          if text.count(audit_anchor) != 1:
              raise SystemExit("rehearsal: audit insertion anchor mismatch")
          rehearsal.write_text(text.replace(audit_anchor, audit_insert, 1))
          PY

          (
            cd db/migrations
            sha256sum \
              0001_initial.down.sql 0001_initial.up.sql \
              0002_auth_foundation.down.sql 0002_auth_foundation.up.sql \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          gofmt -w internal/auth/store.go internal/auth/store_session_tx.go
          go mod verify
          go vet ./...
          go test ./...
          bash -n tests/stages/S04_auth_rehearsal.sh scripts/stages/S04-auth.sh
          grep -Fq 'CREATE POLICY auth_audit_owner_insert' db/migrations/0002_auth_foundation.up.sql
          grep -Fq 'auth_revoke_session_by_id' db/migrations/0002_auth_foundation.up.sql
          grep -Fq 'auth_revoke_other_actor_sessions' db/migrations/0002_auth_foundation.up.sql
          git rm .github/workflows/s04-runtime-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/auth/store.go internal/auth/store_session_tx.go db/migrations/0002_auth_foundation.up.sql db/migrations/0002_auth_foundation.down.sql db/migrations/SHA256SUMS tests/stages/S04_auth_rehearsal.sh
          git commit -m 'fix: enforce scoped S04 audit and session revocation'
          git push origin HEAD:s04-auth
