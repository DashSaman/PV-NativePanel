name: DB Diagnostic Temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 18
        run: |
          set -Eeuo pipefail
          docker run --detach --name pvnaive-dbdiag --network host --env POSTGRES_PASSWORD=pvnaive-ci-only postgres:18-bookworm
          for i in $(seq 1 60); do
            docker exec pvnaive-dbdiag pg_isready --username postgres --dbname postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - name: Capture health test output
        run: |
          set +e
          docker run --rm --network host --env PGPASSWORD=pvnaive-ci-only --env PVNAIVE_DB_HOST=127.0.0.1 --env PVNAIVE_DB_PORT=5432 --env PVNAIVE_DB_USER=postgres --volume "${GITHUB_WORKSPACE}:/repo" --workdir /repo postgres:18-bookworm bash tests/db/health_test.sh > health-output.txt 2>&1
          rc=$?
          echo "$rc" > health-rc.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: db-health-output
          path: |
            health-output.txt
            health-rc.txt
      - name: Stop PostgreSQL 18
        if: always()
        run: docker rm --force pvnaive-dbdiag >/dev/null 2>&1 || true
