name: S04 task4 format and tidy

on:
  push:
    branches: [s04-auth]

permissions:
  contents: write

jobs:
  format-tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s04-auth
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Pin pgx, format and tidy
        run: |
          set -Eeuo pipefail
          go get github.com/jackc/pgx/v5@v5.10.0
          gofmt -w internal/auth/store.go internal/auth/store_test.go
          go mod tidy
          go test ./internal/auth ./internal/database
          rm -- .github/workflows/s04-task4-format-tidy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum internal/auth/store.go internal/auth/store_test.go .github/workflows/s04-task4-format-tidy.yml
          git commit -m 'build: pin pgx and format S04 auth store'
          git push origin HEAD:s04-auth
