name: WS1 Lifecycle Head Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'parallel/ws1-runtime-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws1-runtime-accounting
          fetch-depth: 1
      - run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/db/customer_lifecycle_migration_test.sh')
          s=p.read_text()
          old='# Exercise each destructive rollback in order: v8 -> v7 -> v6 -> v5 -> v4 -> v3.\nfor want in 7 6 5 4 3; do'
          new='# Exercise each destructive rollback in order: v9 -> v8 -> v7 -> v6 -> v5 -> v4 -> v3.\nfor want in 8 7 6 5 4 3; do'
          if s.count(old) != 1:
              raise SystemExit('unexpected lifecycle rollback contract shape')
          p.write_text(s.replace(old,new,1))
          PY
          git rm -- .github/workflows/ws1-lifecycle-head-fix.yml
          git config user.name 'PVNaive WS1 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/db/customer_lifecycle_migration_test.sh
          git diff --cached --check
          git commit -m 'test(ws1): include schema 9 in lifecycle rollback chain'
          git push origin HEAD:parallel/ws1-runtime-accounting
