name: Sync tested live UI

on:
  push:
    branches:
      - fix/customer-list-ui-cleanup
    paths:
      - .github/workflows/sync-tested-live-ui.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download verified patch
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            'https://namir.softarg.ir/pvnaive-ui-sync-901691139e4f24783d05f77c.patch' \
            -o /tmp/pvnaive-ui.patch
          echo '2bf0c1576484a8add5de74bbc3f0bb53e70c989b48561554bb923ac9e368aba6  /tmp/pvnaive-ui.patch' | sha256sum -c -
          git apply --check /tmp/pvnaive-ui.patch
          git apply /tmp/pvnaive-ui.patch

      - name: Commit tested snapshot
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/sync-tested-live-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: polish panel and subscription account UI'
          git push origin HEAD:${{ github.ref_name }}
