name: WS1 Schema10 Finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'parallel/ws1-runtime-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws1-runtime-accounting
          fetch-depth: 0
      - name: Apply schema10 finalization
        run: python3 scripts/ci/finalize_schema10.py
      - name: Verify and commit
        run: |
          set -Eeuo pipefail
          bash -n scripts/db/set-expected-schema-version.sh tests/db/*.sh tests/stages/*.sh
          (cd db/migrations && sha256sum --check --strict SHA256SUMS >/dev/null)
          git rm -f -- .github/workflows/ws1-pending-claim-fix.yml scripts/ci/finalize_schema10.py
          git config user.name 'PVNaive Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'WS1_SCHEMA10_FINALIZER=NO_CHANGES'
            exit 0
          fi
          git commit -m 'fix(ws1): finalize schema10 production contracts'
          git push origin HEAD:parallel/ws1-runtime-accounting
