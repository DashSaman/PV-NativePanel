name: WS1 Pending Claim Completeness Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'parallel/ws1-runtime-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws1-runtime-accounting
          fetch-depth: 1
      - name: Make unsettled reservations immediately incomplete
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          migration=Path('db/migrations/0009_direct_naive_exact_accounting.up.sql')
          s=migration.read_text()
          old="""    RETURN QUERY SELECT v_term.id, true, v_allowed, v_reason, v_term.quota_bytes,
                        v_used, v_reserved, v_remaining, v_term.expires_at,
                        v_term.first_connected_at, v_complete;
"""
          new="""    RETURN QUERY SELECT v_term.id, true, v_allowed, v_reason, v_term.quota_bytes,
                        v_used, v_reserved, v_remaining, v_term.expires_at,
                        v_term.first_connected_at, (v_complete AND v_reserved=0);
"""
          if s.count(old) != 1:
              raise SystemExit('authorize completeness return shape changed')
          s=s.replace(old,new,1)
          old="""                        v_term.first_connected_at,v_projection.last_online,(v_sessions>0),v_sessions,
                        (v_projection.accounting_complete AND NOT v_has_stale);
"""
          new="""                        v_term.first_connected_at,v_projection.last_online,(v_sessions>0),v_sessions,
                        (v_projection.accounting_complete AND NOT v_has_stale AND v_projection.reserved_bytes=0);
"""
          if s.count(old) != 1:
              raise SystemExit('read completeness return shape changed')
          migration.write_text(s.replace(old,new,1))

          test=Path('tests/db/direct_naive_accounting_pg18_test.sh')
          t=test.read_text()
          conflict="""conflict=\"$(psql_admin --dbname \"${test_db}\" --tuples-only --no-align --command \"SET ROLE pvnaive_app; SELECT concat_ws('|',accepted::text,reason) FROM pvnaive.direct_naive_accounting_ingest('11111111-1111-1111-1111-111111111111','alice','direct-1','22222222-2222-2222-2222-222222222222','33333333-3333-3333-3333-333333333333',1,'2026-08-29T18:00:01Z',true,1,0,false);\")\"
[[ \"${conflict##*$'\\n'}\" == 'false|sequence_conflict' ]] || { echo \"ERROR: sequence conflict: ${conflict}\" >&2; exit 1; }
"""
          if t.count(conflict) != 1:
              raise SystemExit('sequence conflict test shape changed')
          t=t.replace(conflict,'',1)

          marker="""[[ \"${claim1##*$'\\n'}\" == 80 && \"${claim2##*$'\\n'}\" == 20 ]] || { echo \"ERROR: shared reservation ${claim1}/${claim2}\" >&2; exit 1; }
"""
          pending=marker+"""
# Any unsettled pre-write reservation makes exactness immediately incomplete.
pending_read=\"$(psql_admin --dbname \"${test_db}\" --tuples-only --no-align --command \"SET ROLE pvnaive_app; SELECT concat_ws('|',remaining_bytes::text,accounting_complete::text) FROM pvnaive.direct_naive_accounting_read('cccccccc-cccc-cccc-cccc-cccccccccccc','2026-08-29T18:00:03Z',90);\")\"
[[ \"${pending_read##*$'\\n'}\" == '0|false' ]] || { echo \"ERROR: pending reservation read: ${pending_read}\" >&2; exit 1; }
pending_auth=\"$(psql_admin --dbname \"${test_db}\" --tuples-only --no-align --command \"SET ROLE pvnaive_app; SELECT concat_ws('|',reason,accounting_complete::text) FROM pvnaive.direct_naive_accounting_authorize('11111111-1111-1111-1111-111111111111','2026-08-29T18:00:03Z');\")\"
[[ \"${pending_auth##*$'\\n'}\" == 'quota_reserved|false' ]] || { echo \"ERROR: pending reservation authorize: ${pending_auth}\" >&2; exit 1; }
"""
          if t.count(marker) != 1:
              raise SystemExit('claim assertion shape changed')
          t=t.replace(marker,pending,1)

          old_read="""[[ \"${read_now##*$'\\n'}\" == '100|100|0|true|2|false' || \"${read_now##*$'\\n'}\" == '100|100|0|true|2|true' ]] || { echo \"ERROR: fresh read: ${read_now}\" >&2; exit 1; }
"""
          new_read="""[[ \"${read_now##*$'\\n'}\" == '100|100|0|true|2|true' ]] || { echo \"ERROR: fresh settled read: ${read_now}\" >&2; exit 1; }

# Same-sequence changed payload is detected and permanently degrades completeness.
"""+conflict
          if t.count(old_read) != 1:
              raise SystemExit('fresh read assertion shape changed')
          test.write_text(t.replace(old_read,new_read,1))
          PY

          up_sha="$(sha256sum db/migrations/0009_direct_naive_exact_accounting.up.sql | awk '{print $1}')"
          sed -i -E "s#^[0-9a-f]{64}  0009_direct_naive_exact_accounting.up.sql#${up_sha}  0009_direct_naive_exact_accounting.up.sql#" db/migrations/SHA256SUMS

          git rm -- .github/workflows/ws1-pending-claim-fix.yml
          git config user.name 'PVNaive WS1 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add db/migrations/0009_direct_naive_exact_accounting.up.sql db/migrations/SHA256SUMS tests/db/direct_naive_accounting_pg18_test.sh
          git diff --cached --check
          git commit -m 'fix(ws1): mark unsettled quota reservations accounting-incomplete'
          git push origin HEAD:parallel/ws1-runtime-accounting
