name: Finalize S03 deployment state

on:
  push:
    paths:
      - '.github/workflows/s03-state-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deployment state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          progress = Path('ops/DEPLOYMENT_PROGRESS.md')
          p = progress.read_text(encoding='utf-8')
          p, s03 = re.subn(r'^\| S03-DATABASE \| NEXT \|.*$', '| S03-DATABASE | PASSED | PostgreSQL schema/migration/backup/restore/health | production + independent postflight passed |', p, count=1, flags=re.M)
          p, s04 = re.subn(r'^\| S04-AUTH \| BLOCKED \|.*$', '| S04-AUTH | NEXT | owner bootstrap, session, MFA, RBAC | active next stage |', p, count=1, flags=re.M)
          p = p.replace('| Kernel | 7.0.0-29-generic |', '| Kernel | 7.0.0-30-generic |', 1)
          if (s03, s04) != (1, 1):
              raise SystemExit(f'ledger patch mismatch: S03={s03} S04={s04}')
          marker = '## S03 FINAL PRODUCTION RESULT -- 2026-08-27 21:53-21:55 UTC'
          if marker not in p:
              lines = [
                  '', '', marker, '',
                  '- `S03-DATABASE=PASSED`; `S04-AUTH=NEXT`.',
                  '- Production source commit: `02b02e0c2a0c2dbada04420b7a853adc08b000ab`.',
                  '- PostgreSQL `18/main`, port 5432, loopback-only on `127.0.0.1` and `::1`.',
                  '- Schema version 1; migration SHA-256 `7f66adefd8f09853db40e3160d0d7793f1bd0bcaf422a94d63d9d95a3a43a059`.',
                  '- 25 RLS tables; pg_hba_file_rules errors=0; pgcrypto present.',
                  '- pvnaive_app has no superuser/createdb/createrole/inherit/replication/bypassrls capability.',
                  '- Application health passed as pvnaive_app; server/client loopback; direct signing-key SELECT denied.',
                  '- Encrypted backup `/var/backups/pvnaive/database/20260827T215317Z/pvnaive.dump.age`; checksum passed; no plaintext dump.',
                  '- Prechange backup `/var/backups/pvnaive/20260827T215310Z-S03-pre`; checksums passed.',
                  '- Restore drill passed schema/ownership/ACL/signing-key verification.',
                  '- Active DB release `/opt/pvnaive/db/releases/0001-7f66adefd8f0`.',
                  '- Health timer enabled+active; latest service result success with exit status 0.',
                  '- Caddy SHA unchanged `101884de2dd11cb9d276df8e72cd068bed50e4ec6eb4ebb477184dda7a86e8b1`.',
                  '- SSH and firewall unchanged; Caddy was not restarted.',
                  '- Independent postflight passed after correcting a read-only JSON parser bug in the first postflight command.',
                  '- Swap remains disabled; reassess before load test/pilot.',
              ]
              p += '\n'.join(lines) + '\n'
          progress.write_text(p, encoding='utf-8')

          handoff = Path('AGENT_HANDOFF.md')
          h = handoff.read_text(encoding='utf-8')
          if '`S03-DATABASE=NEXT`' in h:
              h = h.replace('`S03-DATABASE=NEXT`', '`S03-DATABASE=PASSED`, `S04-AUTH=NEXT`', 1)
          marker2 = '## S03 FINAL -- 2026-08-27 21:53-21:55 UTC'
          if marker2 not in h:
              lines2 = [
                  '', '', marker2, '',
                  '- `S03-DATABASE=PASSED`; `S04-AUTH=NEXT`.',
                  '- PostgreSQL 18/main is installed and loopback-only.',
                  '- Production migration, application health, encrypted backup, restore drill, RLS/role checks and independent postflight all passed.',
                  '- Caddy/SSH/Firewall invariants were preserved.',
                  '- Continue only with S04-AUTH; S05+ remain blocked until S04 passes.',
              ]
              h += '\n'.join(lines2) + '\n'
          handoff.write_text(h, encoding='utf-8')
          PY
          git diff --check
          grep -F '| S03-DATABASE | PASSED |' ops/DEPLOYMENT_PROGRESS.md
          grep -F '| S04-AUTH | NEXT |' ops/DEPLOYMENT_PROGRESS.md
          grep -F 'S03-DATABASE=PASSED' AGENT_HANDOFF.md
      - name: Commit finalized state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/DEPLOYMENT_PROGRESS.md AGENT_HANDOFF.md
          git commit -m 'ops: mark S03 passed and S04 next'
          git push
