name: Finalize S03 deployment state

on:
  push:
    paths:
      - '.github/workflows/s03-state-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deployment state
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d > /tmp/finalize.py
          python3 /tmp/finalize.py
          git diff --check
          grep -F '| S03-DATABASE | PASSED |' ops/DEPLOYMENT_PROGRESS.md
          grep -F '| S04-AUTH | NEXT |' ops/DEPLOYMENT_PROGRESS.md
          grep -F 'S03-DATABASE=PASSED' AGENT_HANDOFF.md
      - name: Commit finalized state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/DEPLOYMENT_PROGRESS.md AGENT_HANDOFF.md
          git commit -m 'ops: mark S03 passed and S04 next'
          git push
