name: WS1 Schema Head Fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'parallel/ws1-runtime-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/ws1-runtime-accounting
          fetch-depth: 1
      - name: Update latest-schema regression expectations
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'tests/db/health_test.sh': [
                  ('PVNAIVE_EXPECTED_SCHEMA_VERSION=8', 'PVNAIVE_EXPECTED_SCHEMA_VERSION=9', 1),
                  ("grep -Fqx 'PVNAIVE_SCHEMA_VERSION=8'", "grep -Fqx 'PVNAIVE_SCHEMA_VERSION=9'", 1),
              ],
              'tests/db/backup_restore_test.sh': [
                  ('[[ "${source_schema}" == "8" ]] || { echo "ERROR: backup source expected latest schema 8, got ${source_schema}" >&2; exit 1; }',
                   '[[ "${source_schema}" == "9" ]] || { echo "ERROR: backup source expected latest schema 9, got ${source_schema}" >&2; exit 1; }', 1),
                  ('grep -Fq \'"schema_version": 8,\' "${backup_dir}/metadata.json"',
                   'grep -Fq \'"schema_version": 9,\' "${backup_dir}/metadata.json"', 1),
                  ('[[ "${restored_schema}" == 8 ]] || { echo "ERROR: restored schema expected 8, got ${restored_schema}" >&2; exit 1; }',
                   '[[ "${restored_schema}" == 9 ]] || { echo "ERROR: restored schema expected 9, got ${restored_schema}" >&2; exit 1; }', 1),
              ],
              'tests/db/customer_lifecycle_migration_test.sh': [
                  ('[[ "${version}" == "8" ]] || { echo "ERROR: schema version=${version}, want=8" >&2; exit 1; }',
                   '[[ "${version}" == "9" ]] || { echo "ERROR: schema version=${version}, want=9" >&2; exit 1; }', 1),
              ],
              'tests/db/customer_idempotency_migration_test.sh': [
                  ("grep -Fqx 'PVNAIVE_SCHEMA_VERSION=8'", "grep -Fqx 'PVNAIVE_SCHEMA_VERSION=9'", 1),
                  ("echo 'ERROR: full customer migration stack did not advance schema to v8'", "echo 'ERROR: full customer migration stack did not advance schema to v9'", 1),
              ],
          }

          for filename, ops in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in ops:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{filename}: expected {expected} occurrence(s) of {old!r}, got {count}')
                  text = text.replace(old, new, expected)
              path.write_text(text)
          PY
          git rm -- .github/workflows/ws1-schema-head-fix.yml
          git config user.name 'PVNaive WS1 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/db/health_test.sh tests/db/backup_restore_test.sh \
            tests/db/customer_lifecycle_migration_test.sh tests/db/customer_idempotency_migration_test.sh
          git diff --cached --check
          git commit -m 'test(ws1): advance latest-schema regressions to v9'
          git push origin HEAD:parallel/ws1-runtime-accounting
