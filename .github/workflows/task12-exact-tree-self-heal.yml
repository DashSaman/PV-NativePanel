name: Task12 Exact Tree Self-Heal

on:
  push:
    branches:
      - lead/task12-session-management-published-2026-08-31

permissions:
  contents: write

jobs:
  heal:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify exact reviewed Task12 tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .task12-exact.patch.gz.b64
          base64 -d .task12-exact.patch.gz.b64 | gzip -d >/tmp/task12-exact.patch
          echo 'ea25c9be5133ecd1074e73889bfcc661a5d45fba4b3629abd64a58b83eeb8b05  /tmp/task12-exact.patch' | sha256sum --check --strict
          git apply --check /tmp/task12-exact.patch
          git apply --binary /tmp/task12-exact.patch
          rm -f .task12-exact.patch.gz.b64 .github/workflows/task12-exact-tree-self-heal.yml
          git diff --check
          git add -A
          actual_tree="$(git write-tree)"
          expected_tree='4869a778c3704a8482e44d7cb8321d5516b73499'
          test "$actual_tree" = "$expected_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(task12): publish exact reviewed operator session tree'
          git push origin HEAD:lead/task12-session-management-published-2026-08-31
