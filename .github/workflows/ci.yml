name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Runtime agent safety rehearsal
        run: bash tests/stages/S04R_runtime_agent_rehearsal.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 18 on the runner network
        run: |
          set -Eeuo pipefail
          docker pull postgres:18-bookworm
          docker run --detach \
            --name pvnaive-postgres18 \
            --network host \
            --env POSTGRES_PASSWORD=pvnaive-ci-only \
            postgres:18-bookworm

          for i in $(seq 1 60); do
            if docker exec pvnaive-postgres18 pg_isready --username postgres --dbname postgres >/dev/null 2>&1; then
              echo "POSTGRES18_READY=PASSED"
              exit 0
            fi
            sleep 1
          done

          docker logs pvnaive-postgres18
          echo "POSTGRES18_READY=FAILED" >&2
          exit 1

      - name: Run shell, migration, health, backup and restore gates
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network host \
            --env PGPASSWORD=pvnaive-ci-only \
            --env PVNAIVE_DB_HOST=127.0.0.1 \
            --env PVNAIVE_DB_PORT=5432 \
            --env PVNAIVE_DB_USER=postgres \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            postgres:18-bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends age file python3 >/dev/null

              bash -n scripts/db/*.sh scripts/auth/*.sh scripts/release/*.sh scripts/stages/*.sh tests/db/*.sh tests/stages/*.sh tests/auth/*.sh tests/release/*.sh tests/site/*.sh
              bash tests/site/public_homepage_test.sh
              bash tests/site/public_portal_routes_test.sh
              bash tests/stages/S03_preflight_test.sh
              bash tests/stages/S03_apt_candidate_pipefail_test.sh
              bash tests/stages/S03_ubuntu2604_contract_test.sh
              bash tests/stages/S04_preflight_test.sh
              bash tests/stages/S04_db_env_version_test.sh
              bash tests/stages/S04_db_release_promotion_test.sh
              bash tests/stages/S04R_preflight_contract_test.sh
              bash tests/stages/S04R_upgrade_contract_test.sh
              bash tests/stages/S05_upgrade_contract_test.sh
              bash tests/stages/S06_owner_upgrade_contract_test.sh
              bash tests/db/lib_test.sh
              bash tests/db/migration_test.sh
              bash tests/db/health_test.sh
              bash tests/db/backup_restore_test.sh
              bash tests/db/backup_collision_test.sh
              bash tests/db/auth_migration_test.sh
              bash tests/db/naive_runtime_migration_test.sh
              bash tests/db/customer_lifecycle_migration_test.sh
              bash tests/db/direct_naive_accounting_migration_test.sh
              bash tests/db/customer_idempotency_migration_test.sh
              bash tests/db/accounting_baseline_migration_test.sh
              bash tests/db/subscription_account_projection_migration_test.sh
              bash tests/db/run_schema_fixture_test.sh 6 tests/db/direct_subscription_migration_test.sh
              bash tests/db/subscription_token_recovery_migration_test.sh
              bash tests/auth/bootstrap_owner_test.sh
            '

      - name: PostgreSQL 18 logs on failure
        if: failure()
        run: docker logs pvnaive-postgres18 || true

      - name: Stop PostgreSQL 18
        if: always()
        run: docker rm --force pvnaive-postgres18 >/dev/null 2>&1 || true

  rehearsal:
    needs: [go, web, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove pinned forwardproxy CONNECT accounting boundary
        run: bash tests/accounting/pinned_forwardproxy_boundary_test.sh
      - name: Prove pinned Naive Caddy supports multiple basic_auth directives
        run: |
          set -Eeuo pipefail
          archive=/tmp/caddy-forwardproxy-naive.tar.xz
          extract_dir=/tmp/caddy-forwardproxy-naive
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/klzgrad/forwardproxy/releases/download/v2.11.2-naive/caddy-forwardproxy-naive.tar.xz
          echo '19eccb7321dd877a5fb4a3dba6ef1b745185188b616c96cc6201f1a1fc0380a8  /tmp/caddy-forwardproxy-naive.tar.xz' | sha256sum --check --strict
          mkdir -p "${extract_dir}"
          tar -xJf "${archive}" -C "${extract_dir}"
          caddy_bin="$(find "${extract_dir}" -type f -name caddy -print -quit)"
          [[ -n "${caddy_bin}" ]] || { echo 'ERROR: pinned archive does not contain caddy' >&2; exit 1; }
          chmod +x "${caddy_bin}"
          CADDY_BIN="${caddy_bin}" bash tests/stages/S04R_caddy_multi_auth_proof.sh
      - name: Build static rehearsal binaries
        run: |
          set -Eeuo pipefail
          mkdir -p dist/rehearsal
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/rehearsal/pvnaive ./cmd/pvnaive
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/rehearsal/pvnaive-password ./cmd/pvnaive-password
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/rehearsal/pvnaive-runtime-agent ./cmd/pvnaive-runtime-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/rehearsal/pvnaive-runtime-agent-rehearsal ./tests/helpers/runtime-agent
      - name: Start PostgreSQL 18
        run: |
          set -Eeuo pipefail
          docker pull postgres:18-bookworm
          docker run --detach \
            --name pvnaive-s04-postgres18 \
            --network host \
            --env POSTGRES_PASSWORD=pvnaive-ci-only \
            postgres:18-bookworm
          for i in $(seq 1 60); do
            if docker exec pvnaive-s04-postgres18 pg_isready --username postgres --dbname postgres >/dev/null 2>&1; then
              echo "S04_POSTGRES18_READY=PASSED"
              exit 0
            fi
            sleep 1
          done
          docker logs pvnaive-s04-postgres18
          exit 1
      - name: Run end-to-end S04 authentication rehearsal
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network host \
            --env PGPASSWORD=pvnaive-ci-only \
            --env PVNAIVE_DB_HOST=127.0.0.1 \
            --env PVNAIVE_DB_PORT=5432 \
            --env PVNAIVE_DB_USER=postgres \
            --env GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --env GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            postgres:18-bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends curl >/dev/null
              bash tests/stages/S04_auth_rehearsal.sh
            '
      - name: Run full S04R runtime rehearsal
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network host \
            --env PGPASSWORD=pvnaive-ci-only \
            --env PVNAIVE_DB_HOST=127.0.0.1 \
            --env PVNAIVE_DB_PORT=5432 \
            --env PVNAIVE_DB_USER=postgres \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            postgres:18-bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends curl jq >/dev/null
              bash tests/stages/S04R_full_rehearsal.sh
            '
      - name: PostgreSQL 18 logs on failure
        if: failure()
        run: docker logs pvnaive-s04-postgres18 || true
      - name: Stop PostgreSQL 18
        if: always()
        run: docker rm --force pvnaive-s04-postgres18 >/dev/null 2>&1 || true

  bundle:
    needs: [rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production S06 owner bundle
        env:
          PVNAIVE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/release/build-s06-owner-bundle.sh
      - name: Verify S06 owner production bundle contract
        run: bash tests/release/S06_owner_bundle_contract_test.sh dist/artifacts
      - name: Verify production archive checksum
        run: |
          set -Eeuo pipefail
          cd dist/artifacts
          sha256sum --check --strict *.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PVNaive-S06-Owner-${{ github.event.pull_request.head.sha }}
          path: |
            dist/artifacts/*.tar.gz
            dist/artifacts/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14