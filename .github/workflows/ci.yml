name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 18 on the runner network
        run: |
          set -Eeuo pipefail
          docker pull postgres:18-bookworm
          docker run --detach \
            --name pvnaive-postgres18 \
            --network host \
            --env POSTGRES_PASSWORD=pvnaive-ci-only \
            postgres:18-bookworm

          for i in $(seq 1 60); do
            if docker exec pvnaive-postgres18 pg_isready --username postgres --dbname postgres >/dev/null 2>&1; then
              echo "POSTGRES18_READY=PASSED"
              exit 0
            fi
            sleep 1
          done

          docker logs pvnaive-postgres18
          echo "POSTGRES18_READY=FAILED" >&2
          exit 1

      - name: Run shell, migration, health, backup and restore gates
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network host \
            --env PGPASSWORD=pvnaive-ci-only \
            --env PVNAIVE_DB_HOST=127.0.0.1 \
            --env PVNAIVE_DB_PORT=5432 \
            --env PVNAIVE_DB_USER=postgres \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            postgres:18-bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends age >/dev/null

              bash -n scripts/db/*.sh scripts/stages/*.sh tests/db/*.sh tests/stages/*.sh
              bash tests/stages/S03_preflight_test.sh
              bash tests/stages/S03_apt_candidate_pipefail_test.sh
              bash tests/stages/S03_ubuntu2604_contract_test.sh
              bash tests/db/lib_test.sh
              bash tests/db/migration_test.sh
              bash tests/db/health_test.sh
              bash tests/db/backup_restore_test.sh
            '

      - name: PostgreSQL 18 logs on failure
        if: failure()
        run: docker logs pvnaive-postgres18 || true

      - name: Stop PostgreSQL 18
        if: always()
        run: docker rm --force pvnaive-postgres18 >/dev/null 2>&1 || true
