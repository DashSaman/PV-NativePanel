name: S04 DB release stage patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s04-auth
          fetch-depth: 0
      - name: Apply guarded S04 stage wiring patch
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('scripts/stages/S04-auth.sh')
          s = p.read_text()

          if 'promote_db_tooling_release()' in s:
              print('S04_DB_RELEASE_STAGE_PATCH=ALREADY_APPLIED')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_ASSERTION_FAILED:{label}:count={count}')
              s = s.replace(old, new, 1)

          replace_once(
              'db_env_schema_updated=0\nrollback_failures=()\n',
              'db_env_schema_updated=0\ndb_release_promoted=0\ndb_release_old=""\ndb_release_new=""\nrollback_failures=()\n',
              'state variables',
          )

          old = """current_schema_version() {
            postgres_psql --dbname pvnaive --tuples-only --no-align \\
              --command 'SELECT COALESCE(MAX(version),0) FROM pvnaive.schema_migrations'
          }

          rollback_on_error() {
          """
          new = """current_schema_version() {
            postgres_psql --dbname pvnaive --tuples-only --no-align \\
              --command 'SELECT COALESCE(MAX(version),0) FROM pvnaive.schema_migrations'
          }

          promote_db_tooling_release() {
            local promotion_output
            promotion_output="$(
              PVNAIVE_DB_RELEASE_SOURCE_ROOT="${repo_root}" \\
              PVNAIVE_DB_RELEASE_ROOT=/opt/pvnaive/db/releases \\
              PVNAIVE_DB_CURRENT_LINK=/opt/pvnaive/db/current \\
              PVNAIVE_DB_RELEASE_SCHEMA_VERSION=2 \\
              PVNAIVE_DB_RELEASE_MIGRATION_FILE=0002_auth_foundation.up.sql \\
              PVNAIVE_DB_RELEASE_OWNER_USER=root \\
              PVNAIVE_DB_RELEASE_OWNER_GROUP=pvnaive \\
                bash "${repo_root}/scripts/db/promote-release.sh"
            )"
            echo "${promotion_output}"
            db_release_old="$(awk -F= '/^PVNAIVE_DB_RELEASE_OLD=/ {print $2}' <<<"${promotion_output}")"
            db_release_new="$(awk -F= '/^PVNAIVE_DB_RELEASE_NEW=/ {print $2}' <<<"${promotion_output}")"
            [[ "${db_release_new}" =~ ^/opt/pvnaive/db/releases/0002-[0-9a-f]{12}$ ]] || die "invalid promoted DB release path"
            [[ -d "${db_release_new}" ]] || die "promoted DB release directory is missing"
            [[ "$(readlink -f /opt/pvnaive/db/current)" == "${db_release_new}" ]] || die "DB current link did not select promoted release"
            grep -Fq 'actor_totp_factors' /opt/pvnaive/db/current/scripts/db/health.sh || die "promoted DB health release is not S04-aware"
            db_release_promoted=1
          }

          rollback_on_error() {
          """
          replace_once(old, new, 'promotion function')

          rollback_anchor = '  verify_caddy_invariants >/dev/null 2>&1 || rollback_failures+=("caddy-invariant")\n  if ((${#rollback_failures[@]} == 0)); then\n'
          rollback_insert = """  if [[ "${db_release_promoted}" == "1" ]]; then
            rollback_schema="$(current_schema_version 2>/dev/null || true)"
            if [[ "${rollback_schema}" == "1" ]]; then
              if [[ -n "${db_release_old}" && "${db_release_old}" != "none" && -d "${db_release_old}" ]]; then
                rm -f -- /opt/pvnaive/db/current.rollback."${BASHPID}" 2>/dev/null || true
                if ln -s "${db_release_old}" /opt/pvnaive/db/current.rollback."${BASHPID}" && \\
                   mv -Tf -- /opt/pvnaive/db/current.rollback."${BASHPID}" /opt/pvnaive/db/current; then
                  :
                else
                  rollback_failures+=("restore-db-release-schema1")
                fi
              else
                rollback_failures+=("restore-db-release-schema1-no-old-release")
              fi
            elif [[ "${rollback_schema}" == "2" ]]; then
              :
            else
              rollback_failures+=("db-release-schema-consistency")
            fi
          fi

            verify_caddy_invariants >/dev/null 2>&1 || rollback_failures+=("caddy-invariant")
            if ((${#rollback_failures[@]} == 0)); then
          """
          replace_once(rollback_anchor, rollback_insert, 'rollback alignment')

          replace_once(
              '  scripts/db/lib.sh scripts/db/migrate.sh scripts/db/rollback.sh scripts/db/backup.sh scripts/db/set-expected-schema-version.sh \\\n',
              '  scripts/db/lib.sh scripts/db/migrate.sh scripts/db/rollback.sh scripts/db/backup.sh scripts/db/health.sh scripts/db/promote-release.sh scripts/db/set-expected-schema-version.sh \\\n',
              'required sources',
          )

          marker_old = """  grep -Fqx 'PVNAIVE_EXPECTED_SCHEMA_VERSION=2' /etc/pvnaive/db.env || die "S04 marker exists but database environment does not expect schema 2"
            systemctl start pvnaive-db-health.service
            [[ "$(systemctl show --property=Result --value pvnaive-db-health.service)" == "success" ]] || die "database health service is not successful for schema 2"
          """
          marker_new = """  grep -Fqx 'PVNAIVE_EXPECTED_SCHEMA_VERSION=2' /etc/pvnaive/db.env || die "S04 marker exists but database environment does not expect schema 2"
            promote_db_tooling_release
            systemctl start pvnaive-db-health.service
            [[ "$(systemctl show --property=Result --value pvnaive-db-health.service)" == "success" ]] || die "database health service is not successful for schema 2"
            grep -Fq 'actor_totp_factors' /opt/pvnaive/db/current/scripts/db/health.sh || die "periodic DB health release is not S04-aware"
          """
          replace_once(marker_old, marker_new, 'existing marker promotion')

          backup_old = """rollback_backup="$(awk -F= '/^PVNAIVE_BACKUP_PATH=/ {print $2}' <<<"${backup_output}")"
          [[ -f "${rollback_backup}" ]] || die "schema-v2 encrypted backup was not produced"

          PVNAIVE_DB_ENV_FILE=/etc/pvnaive/db.env \\
          """
          backup_new = """rollback_backup="$(awk -F= '/^PVNAIVE_BACKUP_PATH=/ {print $2}' <<<"${backup_output}")"
          [[ -f "${rollback_backup}" ]] || die "schema-v2 encrypted backup was not produced"

          promote_db_tooling_release

          PVNAIVE_DB_ENV_FILE=/etc/pvnaive/db.env \\
          """
          replace_once(backup_old, backup_new, 'fresh recovery promotion')

          health_old = """systemctl start pvnaive-db-health.service
          [[ "$(systemctl show --property=Result --value pvnaive-db-health.service)" == "success" ]] || die "database health service failed after schema-v2 environment update"

          install -o root -g pvnaive -m 0640 /dev/null "${auth_key}"
          """
          health_new = """systemctl start pvnaive-db-health.service
          [[ "$(systemctl show --property=Result --value pvnaive-db-health.service)" == "success" ]] || die "database health service failed after schema-v2 environment update"
          grep -Fq 'actor_totp_factors' /opt/pvnaive/db/current/scripts/db/health.sh || die "periodic DB health release is not S04-aware"

          install -o root -g pvnaive -m 0640 /dev/null "${auth_key}"
          """
          replace_once(health_old, health_new, 'post promotion health gate')

          p.write_text(s)
          print('S04_DB_RELEASE_STAGE_PATCH=PASSED')
          PY
          bash -n scripts/stages/S04-auth.sh scripts/db/promote-release.sh
          bash tests/stages/S04_db_release_promotion_test.sh
      - name: Commit patch
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo NO_CHANGES=true
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/stages/S04-auth.sh
          git commit -m 'fix: align periodic DB health release with S04 schema'
          git push origin HEAD:s04-auth
