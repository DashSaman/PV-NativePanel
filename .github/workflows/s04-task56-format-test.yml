name: S04 task5-6 format test

on:
  push:
    branches: [s04-auth]

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s04-auth
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and verify auth HTTP code
        run: |
          set -Eeuo pipefail
          gofmt -w internal/auth/service.go internal/auth/service_test.go internal/auth/store_preauth.go internal/auth/store_session_tx.go internal/httpapi/auth.go internal/httpapi/auth_test.go internal/httpapi/auth_endpoint_test.go internal/httpapi/auth_handlers.go internal/httpapi/request_context.go internal/httpapi/server.go
          go test ./internal/auth ./internal/httpapi ./internal/database
          go vet ./internal/auth ./internal/httpapi ./internal/database
          rm -- .github/workflows/s04-task56-format-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/auth internal/httpapi .github/workflows/s04-task56-format-test.yml
          git commit -m 'build: format and verify S04 auth HTTP implementation'
          git push origin HEAD:s04-auth
