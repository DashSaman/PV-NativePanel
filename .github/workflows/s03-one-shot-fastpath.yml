name: S03 one-shot fastpath patcher

on:
  push:
    branches: [s03-pgcrypto-schema-fix]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s03-pgcrypto-schema-fix
          fetch-depth: 0

      - name: Fold the pgcrypto fix into the initial schema
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main

          # Undo the experimental schema-v2 implementation while keeping the
          # earlier PostgreSQL 18/CI hardening from main.
          git checkout origin/main -- \
            scripts/db/health.sh \
            scripts/db/restore.sh \
            scripts/db/rollback.sh \
            tests/db/health_test.sh \
            tests/db/migration_test.sh

          rm -f \
            db/migrations/0002_pgcrypto_schema_hardening.up.sql \
            db/migrations/0002_pgcrypto_schema_hardening.down.sql \
            ops/evidence/S03_FASTPATH_DECISION_20260827.md

          python3 <<'PY'
          from pathlib import Path

          up = Path('db/migrations/0001_initial.up.sql')
          text = up.read_text()
          anchor = 'CREATE EXTENSION IF NOT EXISTS pgcrypto;\n'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected pgcrypto extension anchor count')
          if text.count('hmac(') != 2:
              raise SystemExit(f'unexpected hmac call count: {text.count("hmac(")}')
          if 'public.hmac(' in text:
              raise SystemExit('initial migration is already patched')

          text = text.replace(
              anchor,
              anchor + 'REVOKE CREATE ON SCHEMA public FROM PUBLIC;\n',
              1,
          )
          text = text.replace('hmac(', 'public.hmac(')
          up.write_text(text)

          down = Path('db/migrations/0001_initial.down.sql')
          down_text = down.read_text().replace('DROP EXTENSION IF EXISTS pgcrypto;\n', '')
          down.write_text(down_text)
          PY

          (
            cd db/migrations
            sha256sum 0001_initial.down.sql 0001_initial.up.sql > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

          # Add a regression contract for the exact root cause: SECURITY
          # DEFINER context functions use an exact schema-qualified HMAC, while
          # untrusted CREATE on public is revoked.
          python3 <<'PY'
          from pathlib import Path

          p = Path('tests/stages/S03_ubuntu2604_contract_test.sh')
          text = p.read_text()
          anchor = 'health="${repo_root}/scripts/db/health.sh"\n'
          replacement = anchor + 'migration="${repo_root}/db/migrations/0001_initial.up.sql"\n'
          if 'migration="${repo_root}/db/migrations/0001_initial.up.sql"' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected contract variable anchor')
              text = text.replace(anchor, replacement, 1)

          contract_anchor = "grep -Fq 'PVNAIVE_SECRET_DIRECT_SELECT=DENIED' \"${health}\"\n"
          contract = contract_anchor + "\n" + \
              "grep -Fq 'REVOKE CREATE ON SCHEMA public FROM PUBLIC;' \"${migration}\"\n" + \
              "[[ \"$(grep -Fc 'public.hmac(' \"${migration}\")\" == \"2\" ]]\n" + \
              "if grep -Fq 'SET search_path = pg_catalog, pvnaive, public' \"${migration}\"; then\n" + \
              "  echo 'ERROR: SECURITY DEFINER search_path must not trust public' >&2\n" + \
              "  exit 1\n" + \
              "fi\n"
          if "grep -Fc 'public.hmac('" not in text:
              if text.count(contract_anchor) != 1:
                  raise SystemExit('unexpected contract insertion anchor')
              text = text.replace(contract_anchor, contract, 1)
          p.write_text(text)
          PY

          bash -n scripts/db/*.sh scripts/stages/*.sh tests/db/*.sh tests/stages/*.sh
          bash tests/stages/S03_ubuntu2604_contract_test.sh

          rm -f .github/workflows/s03-one-shot-fastpath.yml

          git config user.name 'PVNaive CI'
          git config user.email 'pvnaive-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: make S03 pgcrypto context PostgreSQL 18 safe'
          git push origin HEAD:s03-pgcrypto-schema-fix
