# Shared runtime namespace for PVNaive local Unix sockets.
# Runtime-agent owns runtime-agent.sock (root:pvnaive 0660).
# Telemetry-agent owns accounting.sock (pvnaive:pvnaive-telemetry 0660).
# No individual service may own/remove/chown the shared directory lifecycle.
d /run/pvnaive 0771 root pvnaive -
